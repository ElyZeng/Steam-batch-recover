name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches:
      - test/steam-gui-1920x1200-150scale
    tags:
      - "v*"

jobs:
  build-windows-exe:
    runs-on: windows-latest
    env:
      CODESIGN_CERT_PFX_BASE64: ${{ secrets.CODESIGN_CERT_PFX_BASE64 }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Import Code Signing Certificate (Optional)
        if: ${{ env.CODESIGN_CERT_PFX_BASE64 != '' }}
        shell: pwsh
        run: |
          $certPath = Join-Path $env:RUNNER_TEMP "codesign.pfx"
          [IO.File]::WriteAllBytes($certPath, [Convert]::FromBase64String($env:CODESIGN_CERT_PFX_BASE64))
          "CODESIGN_CERT_PATH=$certPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build EXE
        shell: pwsh
        env:
          CODESIGN_CERT_PATH: ${{ env.CODESIGN_CERT_PATH }}
          CODESIGN_CERT_PASSWORD: ${{ secrets.CODESIGN_CERT_PASSWORD }}
          CODESIGN_TIMESTAMP_URL: ${{ vars.CODESIGN_TIMESTAMP_URL }}
        run: powershell -NoLogo -NoProfile -ExecutionPolicy Bypass -File .\build_exe.ps1

      - name: Upload Multi-File EXE
        uses: actions/upload-artifact@v4
        with:
          name: SteamGameBatchRecover-multifile
          path: dist/SteamGameBatchRecover/**
          if-no-files-found: error
          retention-days: 14

      - name: Upload Single-File EXE
        uses: actions/upload-artifact@v4
        with:
          name: SteamGameBatchRecover-standalone
          path: dist/SteamGameBatchRecover-standalone.exe
          if-no-files-found: error
          retention-days: 14
