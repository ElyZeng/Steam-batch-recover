name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches:
      - test/steam-gui-1920x1200-150scale
    tags:
      - "v*"

jobs:
  build-windows-exe:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build EXE
        shell: pwsh
        run: ./build_exe.ps1

      - name: Upload Multi-File EXE
        uses: actions/upload-artifact@v7
        with:
          name: SteamGameBatchRecover-multifile
          path: dist/SteamGameBatchRecover/**
          if-no-files-found: error
          retention-days: 14

      - name: Upload Single-File EXE
        uses: actions/upload-artifact@v7
        with:
          name: SteamGameBatchRecover-standalone
          path: dist/SteamGameBatchRecover-standalone.exe
          if-no-files-found: error
          retention-days: 14

      - name: Upload Template Diagnostic Utility
        uses: actions/upload-artifact@v7
        with:
          name: SteamTemplateTester
          path: dist/SteamTemplateTester.exe
          if-no-files-found: error
          retention-days: 14
